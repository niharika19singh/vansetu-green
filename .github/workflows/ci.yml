name: VanSetu GreenTech CI Pipeline

on:
  push:
    branches:
      - feature/delhi-intervention-ml-pipeline
      - feature/climate-investment-intelligence
  pull_request:
    branches:
      - feature/delhi-intervention-ml-pipeline
      - feature/climate-investment-intelligence

jobs:
  backend-test:
    name: Backend Pytest & Scientific Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install GDAL & spatial libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev gdal-bin

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend pytest suite
        run: |
          cd backend
          python -m pytest tests/ -v

  frontend-test-and-build:
    name: Frontend Test & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run frontend tests
        run: |
          cd frontend
          npm test -- --run

      - name: Build frontend production assets
        run: |
          cd frontend
          npm run build
